<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OASIS · Alertas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@700;800&family=Mulish:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/oasis.css">
  <link rel="stylesheet" href="css/tabla.css">
  <link rel="stylesheet" href="css/lectura.css">
</head>
<body>
  <header class="topbar" id="barra"></header>

  <main class="pagina" id="app" v-cloak>
    <div class="eyebrow">{{ eyebrow }}</div>
    <h1 class="titulo">Alertas</h1>

    <div v-if="errorCarga" class="alerta error" style="margin-bottom:14px">{{ errorCarga }}</div>

    <div class="filtros filtros-sueltos filtros-alertas">
      <div class="campo">
        <label for="f-mercado">Mercado</label>
        <select id="f-mercado" v-model="filtros.mercado" :disabled="misMercados.length === 1">
          <option v-if="misMercados.length > 1" value="">Todos</option>
          <option v-for="m in misMercados" :key="m.id" :value="m.id">{{ m.codigo }} · {{ m.nombre }}</option>
        </select>
      </div>
    </div>

    <div v-if="cargando" class="card"><div class="vacio">Cargando alertas…</div></div>
    <div v-else-if="!grupos.length && !errorCarga" class="alerta ok sin-alertas">
      Sin alertas{{ codigoFiltro ? ' en ' + codigoFiltro : '' }}: la captura está completa.
    </div>

    <section v-for="g in grupos" :key="g.alerta" class="card grupo-alertas">
      <div class="card-cab">
        <h2>{{ g.titulo }}<span class="cuenta">{{ g.casos.length }}</span></h2>
      </div>
      <p v-if="g.explica" class="explica">{{ g.explica }}</p>
      <ul class="lista-alertas">
        <li v-for="a in g.casos" :key="a.alerta + a.compra_id + '-' + a.material_id">
          <a :href="enlace(g, a)" :title="`${a.referencia} · ${ubicacion(a)}`">
            <span v-if="!codigoFiltro" class="mk">{{ a.mercado }}</span>
            <span class="ref">{{ a.referencia }}</span>
            <span class="ubic">{{ ubicacion(a) }}</span>
            <span class="ir">→</span>
          </a>
        </li>
      </ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="config.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/componentes.js"></script>
  <script src="js/alertas.js"></script>
</body>
</html>
